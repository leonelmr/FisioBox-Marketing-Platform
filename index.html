<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FisioBox AI Marketing Suite</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              dark:    '#0d1b2a',
              sidebar: '#0f2133',
              card:    '#152639',
              border:  '#1e3a52',
              teal:    '#0ea5e9',
              tealDark:'#0284c7',
              orange:  '#f97316',
              orangeD: '#ea6c0a',
              green:   '#22c55e',
              yellow:  '#eab308',
              red:     '#ef4444',
            }
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { background: #0d1b2a; color: #e2e8f0; font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f2133; }
    ::-webkit-scrollbar-thumb { background: #1e3a52; border-radius: 3px; }
    .nav-item { transition: all 0.15s ease; }
    .nav-item:hover { background: rgba(14,165,233,0.12); }
    .nav-item.active { background: rgba(14,165,233,0.18); border-left: 3px solid #f97316; }
    .card { background: #152639; border: 1px solid #1e3a52; border-radius: 12px; }
    .btn-primary { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; border: none; cursor: pointer; transition: all 0.2s; border-radius: 8px; }
    .btn-primary:hover { background: linear-gradient(135deg, #38bdf8, #0ea5e9); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(14,165,233,0.3); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-orange { background: linear-gradient(135deg, #f97316, #ea580c); color: white; border: none; cursor: pointer; transition: all 0.2s; border-radius: 8px; }
    .btn-orange:hover { background: linear-gradient(135deg, #fb923c, #f97316); transform: translateY(-1px); }
    .btn-ghost { background: transparent; border: 1px solid #1e3a52; color: #94a3b8; cursor: pointer; transition: all 0.2s; border-radius: 8px; }
    .btn-ghost:hover { border-color: #0ea5e9; color: #e2e8f0; }
    .input { background: #0d1b2a; border: 1px solid #1e3a52; color: #e2e8f0; border-radius: 8px; padding: 10px 14px; width: 100%; outline: none; transition: border-color 0.2s; }
    .input:focus { border-color: #0ea5e9; }
    .input::placeholder { color: #475569; }
    .textarea { background: #0d1b2a; border: 1px solid #1e3a52; color: #e2e8f0; border-radius: 8px; padding: 10px 14px; width: 100%; outline: none; transition: border-color 0.2s; resize: vertical; min-height: 100px; }
    .textarea:focus { border-color: #0ea5e9; }
    .select { background: #0d1b2a; border: 1px solid #1e3a52; color: #e2e8f0; border-radius: 8px; padding: 10px 14px; width: 100%; outline: none; cursor: pointer; }
    .select:focus { border-color: #0ea5e9; }
    .label { color: #94a3b8; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: block; }
    .score-badge { display: inline-flex; align-items: center; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; }
    .score-green { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
    .score-yellow { background: rgba(234,179,8,0.15); color: #eab308; border: 1px solid rgba(234,179,8,0.3); }
    .score-red { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .status-draft { background: rgba(100,116,139,0.2); color: #94a3b8; }
    .status-review { background: rgba(234,179,8,0.15); color: #eab308; }
    .status-approved { background: rgba(14,165,233,0.15); color: #0ea5e9; }
    .status-published { background: rgba(34,197,94,0.15); color: #22c55e; }
    .platform-ig { background: linear-gradient(135deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .platform-tt { background: #000; border: 1px solid #ff0050; }
    .platform-fb { background: #1877f2; }
    .platform-blog { background: #0ea5e9; }
    .platform-wa { background: #25d366; }
    .platform-ads { background: linear-gradient(135deg, #fbbc04, #ea4335); }
    .loading-dots::after { content: ''; animation: dots 1.5s infinite; }
    @keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }
    .fade-in { animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .sidebar-logo { background: linear-gradient(135deg, #0ea5e9, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .content-output { background: #0a1520; border: 1px solid #1e3a52; border-radius: 8px; padding: 16px; white-space: pre-wrap; font-size: 0.9rem; line-height: 1.7; color: #cbd5e1; max-height: 500px; overflow-y: auto; }
    .tab-active { border-bottom: 2px solid #f97316; color: #f97316; }
    .cal-day { min-height: 80px; border: 1px solid #1e3a52; border-radius: 6px; padding: 4px; cursor: pointer; transition: background 0.15s; }
    .cal-day:hover { background: rgba(14,165,233,0.05); }
    .cal-item { border-radius: 4px; padding: 2px 6px; font-size: 0.7rem; margin-bottom: 2px; cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .progress-bar { height: 6px; border-radius: 3px; background: #1e3a52; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal { background: #152639; border: 1px solid #1e3a52; border-radius: 16px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .slider-track { width: 100%; height: 6px; background: #1e3a52; border-radius: 3px; position: relative; }
    .slider-fill { height: 100%; border-radius: 3px; background: linear-gradient(90deg, #0ea5e9, #f97316); }
    input[type=range] { -webkit-appearance: none; width: 100%; height: 6px; background: transparent; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #f97316; cursor: pointer; border: 2px solid #0d1b2a; }
    input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 3px; background: linear-gradient(90deg, #0ea5e9, #1e3a52); }
    .tooltip { position: relative; }
    .tooltip:hover::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: #0a1520; color: #e2e8f0; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; white-space: nowrap; border: 1px solid #1e3a52; z-index: 100; }
    @media (max-width: 768px) {
      #sidebar { transform: translateX(-100%); position: fixed; z-index: 50; }
      #sidebar.open { transform: translateX(0); }
      #main-content { margin-left: 0 !important; }
    }
  </style>
</head>
<body>

<div id="app"></div>

<!-- Load dependencies in order -->
<script src="prompts.js"></script>
<script src="storage.js"></script>
<script src="agents.js"></script>
<script src="ui.js"></script>

<script>
// ── GLOBAL STATE ──────────────────────────────────────────────
window.App = {
  currentView: 'dashboard',
  generatorStep: 1,
  generatorData: {},
  calendarMonth: new Date(),
  modal: null,
  sidebarOpen: false,
};

// ── NAVIGATION ─────────────────────────────────────────────────
function navigate(view) {
  App.currentView = view;
  App.sidebarOpen = false;
  render();
}

// ── TOAST NOTIFICATIONS ───────────────────────────────────────
function showToast(msg, type = 'info') {
  const colors = { info: '#0ea5e9', success: '#22c55e', error: '#ef4444', warning: '#eab308' };
  const icons  = { info: 'ℹ️', success: '✅', error: '❌', warning: '⚠️' };
  const el = document.createElement('div');
  el.style.cssText = `position:fixed;bottom:24px;right:24px;z-index:9999;background:#152639;border:1px solid ${colors[type]};
    color:#e2e8f0;padding:14px 18px;border-radius:10px;font-size:0.9rem;max-width:360px;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);display:flex;align-items:center;gap:10px;
    animation:fadeIn 0.3s ease;`;
  el.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 4000);
}

// ── CLIPBOARD ─────────────────────────────────────────────────
function copyToClipboard(text, label = 'Contenido') {
  navigator.clipboard.writeText(text).then(() => showToast(`${label} copiado al portapapeles`, 'success'))
    .catch(() => showToast('No se pudo copiar', 'error'));
}

// ── DOWNLOAD TXT ──────────────────────────────────────────────
function downloadTxt(text, filename = 'fisiobox-contenido') {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${filename}.txt`;
  a.click(); URL.revokeObjectURL(url);
  showToast('Archivo descargado', 'success');
}

// ── SCORE BADGE ───────────────────────────────────────────────
function scoreBadge(score) {
  if (!score && score !== 0) return '';
  const cls = score >= 8 ? 'score-green' : score >= 5 ? 'score-yellow' : 'score-red';
  return `<span class="score-badge ${cls}">${score}/10</span>`;
}

// ── SCORE COLOR ───────────────────────────────────────────────
function scoreColor(score) {
  return score >= 8 ? '#22c55e' : score >= 5 ? '#eab308' : '#ef4444';
}

// ── PLATFORM BADGE ────────────────────────────────────────────
function platformBadge(platform) {
  const map = {
    'Instagram': 'platform-ig', 'TikTok': 'platform-tt',
    'Facebook': 'platform-fb', 'Blog': 'platform-blog',
    'WhatsApp': 'platform-wa', 'Ads': 'platform-ads'
  };
  return `<span class="pill ${map[platform] || 'bg-gray-700'} text-white" style="font-size:0.7rem;padding:2px 8px;">${platform}</span>`;
}

// ── MAIN RENDER ───────────────────────────────────────────────
function render() {
  document.getElementById('app').innerHTML = UI.shell();
  UI.bindShell();
}

// Boot
render();
</script>
</body>
</html>
